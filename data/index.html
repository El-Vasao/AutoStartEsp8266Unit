<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>El Line</title>
    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <style>
      [x-cloak] { display: none !important; }
      /* Header toast area (does not affect layout) */
      .site-header { position: relative; }
      .header-toast {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      .header-toast-card {
        pointer-events: none;
        max-width: 520px;
        width: min(520px, calc(100% - 24px));
        background: rgba(17, 26, 46, 0.96);
        color: #e6edf3;
        border: 1px solid rgba(34, 48, 85, 0.85);
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
        border-radius: 14px;
        padding: 12px 14px;
        transform: translateY(-6px);
        opacity: 0;
        transition: transform 0.18s ease, opacity 0.18s ease;
        text-align: center;
        line-height: 1.35;
      }
      .header-toast-card.show {
        transform: translateY(0);
        opacity: 1;
      }
      .header-toast-card.warning {
        border-color: rgba(251, 191, 36, 0.55);
      }
    </style>
    <!-- INJECT_APP_CSS -->
    <!-- INJECT_APP_JS -->
</head>
<body>
    <!--
      UI structure (high level):
      - busy modal (flash commit / blocking ops)
      - confirm dialog modal
      - app container:
        - header (title + mode badge + toast)
        - main tabs (panel/programs/settings/system)
        - tab content:
          - panel: sensors/inputs/relays/triggers/features/info
          - programs: list + editor
          - settings: sub-tabs rendered mostly from UI_SCHEMA via uiForm.fieldRow
          - system: info + actions + OTA + logs
    -->
    <!-- Блокирующая модалка (без закрытия/скипа): запись во flash и т.п. -->
    <div
        x-data
        x-show="$store.uiBusy.open"
        x-cloak
        class="modal-backdrop z-60"
        x-trap.inert.noscroll.noautofocus="$store.uiBusy.open"
        role="dialog"
        aria-modal="true"
    >
        <div class="modal-card modal-card--sm" tabindex="0">
            <h3 class="modal-title" x-text="$store.uiBusy.title"></h3>
            <p class="modal-message" x-text="$store.uiBusy.message"></p>
            <div class="modal-actions">
                <button class="btn" type="button" x-show="!$store.uiBusy.okMode" disabled aria-disabled="true">
                    Подождите… <span x-html="$store.uiFormat.spinnerSvg"></span>
                </button>
                <button class="btn primary" type="button" x-show="$store.uiBusy.okMode" @click="$store.uiBusy.ok()">
                    <span x-text="$store.uiBusy.okLabel || 'OK'"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Модальные подтверждения (перезагрузка, удаление и т.д.) -->
    <div
        x-data
        x-show="$store.uiDialog.open"
        x-cloak
        class="modal-backdrop"
        x-trap.inert.noscroll.noautofocus="$store.uiDialog.open"
        role="dialog"
        aria-modal="true"
    >
        <div class="modal-card" @click.stop tabindex="0">
            <h3 class="modal-title" x-text="$store.uiDialog.title"></h3>
            <p class="modal-message" x-text="$store.uiDialog.message"></p>
            <div class="modal-actions">
                <button class="btn" type="button" @click="$store.uiDialog.cancel()" x-text="$store.uiDialog.cancelLabel || 'Отмена'"></button>
                <button class="btn warning" type="button" @click="$store.uiDialog.extra()" x-show="$store.uiDialog.extraLabel" x-text="$store.uiDialog.extraLabel"></button>
                <button class="btn danger" type="button" @click="$store.uiDialog.confirm()" x-text="$store.uiDialog.confirmLabel || 'Подтвердить'"></button>
            </div>
        </div>
    </div>

    <div class="container" x-data="app" x-cloak :class="{ 'ui-locked': $store.uiState.locked, 'unsaved-hint': $store.uiState.unsavedHint }">
        <div class="init-backdrop" x-show="$store.uiState.locked" x-cloak aria-live="polite" aria-busy="true">
            <div class="init-card">
                <div class="init-title">Загрузка…</div>
                <div class="init-sub">Подгружаем настройки и константы</div>
            </div>
        </div>
        <div class="init-backdrop" x-show="!$store.uiState.locked && $store.uiState.initFailed" x-cloak aria-live="polite" aria-busy="false">
            <div class="init-card">
                <div class="init-title">Аварийный режим</div>
                <div class="init-sub" x-text="$store.uiState.initError || 'Не удалось загрузить данные для UI.'"></div>
                <div class="modal-actions" style="margin-top:10px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                    <button class="btn warning" type="button" @click="$store.deviceMaintenance.performReboot()">Перезагрузить устройство</button>
                    <button class="btn" type="button" @click="$store.uiState.activeTab = 'system'">Прошивка / OTA</button>
                    <button class="btn" type="button" @click="location.reload()">Обновить страницу</button>
                </div>
            </div>
        </div>
        <header class="site-header">
            <div class="header-row">
                <h1>El Line</h1>
                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
                    <div class="status-badge"
                         :class="$store.deviceStatus.modeBadge.class"
                         x-text="$store.deviceStatus.modeBadge.text"></div>
                    <div class="status-badge"
                         :class="$store.deviceStatus.gsmBadge.class"
                         x-text="$store.deviceStatus.gsmBadge.text"></div>
                </div>
            </div>

            <!-- Статус-бар/баннеры/тосты убраны по требованию (моб. UX). -->
        </header>

        <nav class="tab-bar">
            <button class="tab-button" :class="{ active: activeTab === 'panel' }" @click="switchTab('panel')" :disabled="$store.deviceOta.started || $store.uiState.initFailed">Панель</button>
            <button class="tab-button" :class="{ active: activeTab === 'programs', unsaved: $store.uiState.unsavedHint && $store.deviceRuntime.programEditorDirty && $store.programs.current }" @click="switchTab('programs')" :disabled="$store.deviceOta.started || $store.uiState.initFailed">Программы</button>
            <button class="tab-button" :class="{ active: activeTab === 'settings', unsaved: $store.uiState.unsavedHint && $store.settings.dirty }" @click="switchTab('settings')" :disabled="$store.deviceOta.started || $store.uiState.initFailed">Настройки</button>
            <button class="tab-button" :class="{ active: activeTab === 'system' }" @click="switchTab('system')" :disabled="$store.deviceOta.started">Система</button>
        </nav>

        <main x-cloak>
            <!-- Панель управления -->
            <div x-show="activeTab === 'panel'" id="tab-panel" class="tab-pane active">
                <div class="panel-grid">
                    <!-- Датчики -->
                    <div class="card">
                        <h3>Датчики</h3>
                        <template x-if="$store.deviceStatus.loaded">
                            <div class="tile-grid">
                                <template x-for="(s, index) in $store.deviceStatus.tempSensors" :key="index">
                                    <div
                                        class="tile"
                                        :class="$store.uiFormat.tempClass(s?.t ?? 0)"
                                        x-show="!!s && s.valid"
                                        data-gesture="sensor"
                                        :data-index="index"
                                    >
                                        <div class="tile-name" x-text="$store.uiFormat.sensorName(index)"></div>
                                        <div class="tile-sub" x-text="(s && s.valid && typeof s.t === 'number') ? s.t.toFixed(1) + '°C' : ''"></div>
                                    </div>
                                </template>
                                <div class="tile empty" x-show="!$store.deviceStatus.hasValidTemps">Нет данных</div>
                            </div>
                        </template>
                        <template x-if="!$store.deviceStatus.loaded">
                            <div class="loading-placeholder">Загрузка данных...</div>
                        </template>
                    </div>

                    <!-- Входы -->
                    <div class="card">
                        <h3>Входы</h3>
                        <template x-if="$store.deviceStatus.loaded">
                            <div class="tile-grid">
                                <template x-for="(input, index) in $store.deviceStatus.inputs" :key="index">
                                    <div
                                        class="tile"
                                        :class="$store.uiFormat.inputClass(index, input)"
                                        :data-index="index"
                                        data-gesture="input"
                                    >
                                        <div class="tile-name" x-text="$store.uiFormat.inputName(index)"></div>
                                        <div class="tile-sub" x-show="$store.uiFormat.isCounter(index)" x-text="$store.uiFormat.getFrequency(index) + ' rpm'"></div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template x-if="!$store.deviceStatus.loaded">
                            <div class="loading-placeholder">Загрузка данных...</div>
                        </template>
                    </div>
                </div>

                <!-- Реле -->
                <div class="card">
                    <h3>Реле</h3>
                    <template x-if="$store.deviceStatus.loaded">
                        <div class="tile-grid">
                            <template x-for="(state, index) in $store.deviceStatus.relays" :key="index">
                                <div class="tile relay-tile" :class="state ? 'relay-on' : 'relay-off'">
                                    <div class="tile-name" x-text="'K' + (index+1)"></div>
                                    <div class="tile-sub" x-text="state ? 'ON' : 'OFF'"></div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template x-if="!$store.deviceStatus.loaded">
                        <div class="loading-placeholder">Загрузка данных...</div>
                    </template>
                </div>

                <!-- Триггеры на входах -->
                <div class="card" x-show="$store.deviceStatus.loaded && $store.settings.input_triggers?.length">
                    <h3>Триггеры на входах</h3>
                    <div class="tile-grid">
                        <template x-for="(trigger, index) in $store.settings.input_triggers" :key="index">
                            <div
                                class="tile"
                                :class="$store.deviceRuntime.inputTriggerEnabled(index) ? 'trigger-on' : 'trigger-off'"
                                :data-index="index"
                                data-gesture="inputTrigger"
                            >
                                <div class="tile-name" x-text="($store.uiFormat.inputLabelById(trigger.input_id) || ('IN#' + (Number(trigger.input_id) || 0))) + ' → #' + trigger.program_id"></div>
                                <div class="tile-sub" x-text="trigger.trigger_level ? 'HIGH' : 'LOW'"></div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Температурные триггеры -->
                <div class="card" x-show="$store.deviceStatus.loaded && $store.settings.temperature_triggers?.length">
                    <h3>Температурные триггеры</h3>
                    <div class="tile-grid">
                        <template x-for="(trigger, index) in $store.settings.temperature_triggers" :key="index">
                            <div
                                class="tile"
                                :class="$store.deviceRuntime.tempTriggerEnabled(index) ? 'trigger-on' : 'trigger-off'"
                                :data-index="index"
                                data-gesture="tempTrigger"
                            >
                                <div class="tile-name" x-text="$store.uiFormat.sensorLabelById(trigger.sensor_id) + ' → #' + trigger.program_id"></div>
                                <div class="tile-sub" x-text="trigger.comparison + ' ' + (trigger.threshold || 0) + '°C'"></div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Функции (Battery Saver и Термостат) -->
                <div class="card">
                    <h3>Функции</h3>
                    <template x-if="$store.deviceStatus.loaded">
                        <div class="tile-grid-wide">
                            <!-- Battery Saver -->
                            <div
                                class="tile tile-wide"
                                :class="$store.deviceRuntime.batterySaverEnabled ? 'feature-on' : 'feature-off'"
                                data-gesture="batterySaver"
                            >
                                <div class="tile-name">🔋 Battery Saver</div>
                                <div class="tile-sub">
                                    <span x-text="'Запуск при ' + $store.settings.battery_saver.voltage_start_threshold + ' В'"></span>
                                    <span x-show="$store.deviceStatus.voltage" x-text="' | Текущее: ' + $store.uiFormat.formatVoltage($store.deviceStatus.voltage)"></span>
                                </div>
                                <div class="tile-sub" x-text="'Попыток: ' + ($store.deviceRuntime.batterySaverAttemptsToday || 0) + ' / ' + $store.settings.battery_saver.max_attempts_per_day"></div>
                            </div>
                            <!-- Термостат -->
                            <div
                                class="tile tile-wide"
                                :class="$store.deviceRuntime.thermostatEnabled ? 'feature-on' : 'feature-off'"
                                data-gesture="thermostat"
                            >
                                <div class="tile-name">🌡️ Термостат</div>
                                <div class="tile-sub">
                                    <span x-text="$store.uiFormat.sensorLabelById($store.settings.thermostat.sensor_id)"></span>
                                    <span x-text="' | ' + ($store.settings.thermostat.comparison === 'above' ? 'выше' : 'ниже') + ' ' + $store.settings.thermostat.lower_threshold + '°C'"></span>
                                </div>
                                <div class="tile-sub" x-text="'Программы: ↓' + ($store.settings.thermostat.program_id_lower || '—') + ' ↑' + ($store.settings.thermostat.program_id_upper || '—')"></div>
                            </div>
                        </div>
                    </template>
                    <template x-if="!$store.deviceStatus.loaded">
                        <div class="loading-placeholder">Загрузка данных...</div>
                    </template>
                </div>

                <!-- Общая информация (объединённая карточка) -->
                <div class="card">
                    <h3>Общая информация</h3>
                    <template x-if="$store.deviceStatus.loaded">
                        <div>
                            <div class="info-row">
                                <span class="info-label">Двигатель:</span>
                                <span class="info-value" x-text="$store.deviceStatus.engineRunning ? 'Работает' : 'Заглушен'"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Таймер:</span>
                                <span class="info-value" x-text="$store.uiFormat.formatTimer($store.deviceStatus.timerRemaining)"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Текущая программа:</span>
                                <span class="info-value" x-text="$store.deviceStatus.currentProgramName || '—'"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Напряжение:</span>
                                <span class="info-value" x-text="$store.uiFormat.formatVoltage($store.deviceStatus.voltage)"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Аптайм:</span>
                                <span class="info-value" x-text="$store.uiFormat.formatUptime($store.deviceStatus.uptime)"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Последняя программа:</span>
                                <span class="info-value" x-text="$store.deviceStatus.lastProgramName || '—'"></span>
                            </div>
                        </div>
                    </template>
                    <template x-if="!$store.deviceStatus.loaded">
                        <div class="loading-placeholder">Загрузка данных...</div>
                    </template>
                </div>
            </div>

            <!-- Программы (с редактором) -->
            <div x-show="activeTab === 'programs'" id="tab-programs" class="tab-pane">
                <template x-if="$store.programs.loaded">
                    <div>
                        <!-- Кнопка новой программы -->
                        <template x-if="!$store.programs.current">
                            <div class="card">
                                <div class="button-group justify-end">
                                    <button class="btn primary" type="button" @click="$store.programs.newProgram()" :disabled="$store.deviceOta.started">➕ Новая программа</button>
                                </div>
                            </div>
                        </template>

                        <!-- Если список не загрузился, не блокируем UI -->
                        <template x-if="!$store.programs.loadOk && !$store.programs.current">
                            <div class="card">
                                <div>Список программ недоступен (возможно, UI/ассеты не установлены). Создание новой программы доступно.</div>
                            </div>
                        </template>

                        <!-- Список программ -->
                        <template x-if="!$store.programs.current">
                            <div>
                                <template x-if="$store.programs.loading">
                                    <div class="card">Загрузка...</div>
                                </template>
                                <template x-if="!$store.programs.loading && $store.programs.items.length === 0">
                                    <div class="card">Нет созданных программ</div>
                                </template>
                                <div class="programs-grid" x-show="!$store.programs.loading && $store.programs.items.length > 0">
                                    <template x-for="p in $store.programs.items" :key="p.id">
                                        <div class="program-card">
                                            <div class="program-card-header">
                                                <span x-text="'#' + p.id + ' – ' + p.name"></span>
                                            </div>
                                            <div class="program-card-actions">
                                                <button class="btn" type="button" @click="$store.programs.run(p.id)" :disabled="$store.deviceOta.started">Выполнить</button>
                                                <button class="btn" type="button" @click="$store.programs.edit(p.id)" :disabled="$store.deviceOta.started">Редактировать</button>
                                                <button class="btn danger" type="button" @click="$store.programs.delete(p.id)" :disabled="$store.deviceOta.started">Удалить</button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Редактор программ (улучшенный) -->
                        <template x-if="$store.programs.current">
                            <div class="card program-editor" x-data="programEditor" x-init="initEditor()">
                                <h3 x-text="$store.programs.editingMode === 'new' ? 'Создание программы' : 'Редактирование программы'"></h3>
                                <form @submit.prevent="save()" @input="markDirty()" @change="markDirty()">
                                    <div class="form-group">
                                        <div class="form-group" x-data="APP.ui.withFieldShell($store.programForm.fieldRow(form, { type: 'number', valueType: 'int', label: 'ID программы', helpTitle: 'Идентификатор', help: 'ID программы (1..255). Должен быть уникальным.' }, 'id', { errors, errorKey: 'id', onChange: () => { markDirty(); validateDebounced(); } }))">
                                            <label class="form-label" x-text="field.label"></label>
                                            <div class="control-row">
                                                <div class="control-main">
                                                    <input type="text" inputmode="numeric" class="form-control" :class="inputClass()" :value="displayValue()" @input="onNumberInput">
                                                </div>
                                                <button type="button" class="help-btn" :class="helpBtnClass()" x-ref="btn" @click="toggleHelp()" @keydown.escape.prevent.stop="closeHelpSafe()" @keydown="onHelpKeydown" aria-label="Справка">?</button>
                                            </div>
                                            <div class="help-inline-wrap" x-show="shouldShowHelp()" x-collapse x-transition.opacity.duration.120ms @click.outside="closeHelpSafe()" x-cloak>
                                                <div class="help-popover">
                                                    <div class="help-popover-title help-popover-title-error" x-show="hasError()">Ошибка</div>
                                                    <p class="help-popover-text-error" x-show="hasError()" x-text="errorText()"></p>
                                                    <div class="help-popover-title" x-text="field.helpTitle || 'Справка'"></div>
                                                    <p x-text="field.help"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="form-group" x-data="APP.ui.withFieldShell($store.programForm.fieldRow(form, { type: 'text', valueType: 'string', label: 'Название', helpTitle: 'Ограничение', help: 'Название программы (1..31 символ). Длинное имя будет подсвечено как ошибка.' }, 'name', { errors, errorKey: 'name', onChange: () => { markDirty(); validateDebounced(); } }))">
                                            <label class="form-label" x-text="field.label"></label>
                                            <div class="control-row">
                                                <div class="control-main">
                                                    <input type="text" class="form-control" :class="inputClass()" :value="displayValue()" @input="onTextInput">
                                                </div>
                                                <button type="button" class="help-btn" :class="helpBtnClass()" x-ref="btn" @click="toggleHelp()" @keydown.escape.prevent.stop="closeHelpSafe()" @keydown="onHelpKeydown" aria-label="Справка">?</button>
                                            </div>
                                            <div class="help-inline-wrap" x-show="shouldShowHelp()" x-collapse x-transition.opacity.duration.120ms @click.outside="closeHelpSafe()" x-cloak>
                                                <div class="help-popover">
                                                    <div class="help-popover-title help-popover-title-error" x-show="hasError()">Ошибка</div>
                                                    <p class="help-popover-text-error" x-show="hasError()" x-text="errorText()"></p>
                                                    <div class="help-popover-title" x-text="field.helpTitle || 'Справка'"></div>
                                                    <p x-text="field.help"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <h4>Шаги</h4>
                                    <div id="stepsContainer">
                                        <template x-for="(step, index) in form.steps" :key="index">
                                            <div class="step-card" :class="stepCardClass(index)">
                                                <div class="step-action-row">
                                                    <div class="step-action-title" x-text="(step.category ? (step.category + ': ') : '') + (step.actionDef?.label || step.action)"></div>
                                                </div>
                                                <div class="step-params">
                                                    <!-- Универсальный рендер параметров шага по schema (`programStepsUiSchema.params`) -->
                                                    <template x-for="paramKey in (step.actionDef?.params || [])" :key="paramKey">
                                                        <template x-if="!paramUiField(paramKey)?.hidden">
                                                            <div class="step-param-group" x-data="APP.ui.withFieldShell($store.programForm.fieldRow(step, paramUiField(paramKey), paramUiPath(paramKey), paramUiOpts(step, index, paramKey)))">
                                                                <span class="step-param-label" x-text="field.label || paramKey"></span>
                                                                <div class="control-row" :style="field.type === 'toggle' ? 'align-items: center;' : ''">
                                                                    <div class="control-main">
                                                                        <template x-if="field.type === 'select'">
                                                                            <select class="form-control" :class="(inputClass() || stepFieldTone(index, paramUiToneKey(paramKey)))" :value="value" @change="onSelectChange($event); validateDebounced()">
                                                                                <template x-for="opt in options()" :key="String(opt.value)">
                                                                                    <option :value="opt.value" :selected="String(opt.value) === String(value)" x-text="opt.label"></option>
                                                                                </template>
                                                                            </select>
                                                                        </template>
                                                                        <template x-if="field.type === 'number'">
                                                                            <input type="text" :inputmode="(field.valueType === 'int') ? 'numeric' : 'decimal'" class="form-control" :class="(inputClass() || stepFieldTone(index, paramUiToneKey(paramKey)))" :value="displayValue()" @input="onNumberInput($event); validateDebounced()">
                                                                        </template>
                                                                        <template x-if="field.type === 'text'">
                                                                            <input type="text" class="form-control" :class="(inputClass() || stepFieldTone(index, paramUiToneKey(paramKey)))" :value="displayValue()" @input="onTextInput($event); validateDebounced()">
                                                                        </template>
                                                                    </div>

                                                            <template x-if="field.type === 'select'">
                                                                <select
                                                                    class="form-control"
                                                                    :class="$store.settings.triggerFieldTone('temp', idx, field.bind)"
                                                                    :value="value"
                                                                    @change="onSelectChange"
                                                                >
                                                                    <template x-for="opt in options()" :key="String(opt.value)">
                                                                        <option :value="opt.value" x-text="opt.label"></option>
                                                                    </template>
                                                                </select>
                                                            </template>
                                                        </div>

                                                        <button
                                                            type="button"
                                                            class="help-btn"
                                                            :class="helpBtnClass()"
                                                            x-ref="btn"
                                                            @click="openHelp = !openHelp"
                                                            @keydown.escape.prevent.stop="openHelp = false"
                                                            @keydown="onHelpKeydown"
                                                            aria-label="Справка"
                                                        >?</button>
                                                    </div>
                                                    <div class="help-inline-wrap" x-show="openHelp && (field.help || hasError())" x-collapse x-transition.opacity.duration.120ms @click.outside="openHelp = false" x-cloak>
                                                        <div class="help-popover">
                                                            <div class="help-popover-title help-popover-title-error" x-show="hasError()">Ошибка</div>
                                                            <p class="help-popover-text-error" x-show="hasError()" x-text="errorText()"></p>
                                                            <div class="help-popover-title" x-text="field.helpTitle || 'Справка'"></div>
                                                            <p x-text="field.help || ('Поле: ' + (field.label || '') + (path ? (' (' + path + ')') : ''))"></p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="button-group mt-16"><button class="btn" type="button" @click="$store.settings.addTempTrigger()">➕ Добавить температурный триггер</button></div>
                            </div>
                        </div>

                        <!-- Откат / сохранение всех настроек -->
                        <div class="button-group mt-20">
                            <button class="btn primary" type="button" @click="$store.settings.save()" :disabled="$store.settings.loading || $store.deviceOta.started">
                                <span x-show="!$store.settings.loading">Сохранить все настройки</span>
                                <span x-show="$store.settings.loading">
                                    Сохранение... <span x-html="$store.uiFormat.spinnerSvg"></span>
                                </span>
                            </button>
                        </div>
                        <div class="button-group mt-10" x-show="$store.settings.dirty">
                            <button
                                class="btn warning w-100"
                                type="button"
                                @click="$store.settings.revertAll()"
                                :disabled="$store.settings.loading || $store.deviceOta.started"
                            >
                                Откатить изменения
                            </button>
                        </div>
                    </div>
                </template>
                <template x-if="!$store.settings.loaded">
                    <div class="card">Загрузка настроек...</div>
                </template>
            </div>

            <!-- Система -->
            <div x-show="activeTab === 'system'" id="tab-system" class="tab-pane">
                <template x-if="$store.deviceStatus.loaded">
                    <div>
                        <div class="card">
                            <h3>Системная информация</h3>
                            <div class="info-row"><span class="info-label">Версия прошивки:</span> <span class="info-value" x-text="$store.deviceStatus.version || '—'"></span></div>
                            <div class="info-row"><span class="info-label">Режим работы:</span> <span class="info-value" x-text="$store.deviceStatus.modeBadge.text"></span></div>
                            <div class="info-row"><span class="info-label">Аптайм:</span> <span class="info-value" x-text="$store.uiFormat.formatUptime($store.deviceStatus.uptime)"></span></div>
                            <div class="info-row"><span class="info-label">Свободная память (heap):</span> <span class="info-value" x-text="$store.deviceStatus.freeHeap ? $store.deviceStatus.freeHeap + ' Б' : '—'"></span></div>
                            <div class="info-row"><span class="info-label">Последняя ошибка:</span> <span class="info-value error-text" x-text="$store.deviceStatus.lastError || '—'"></span></div>
                        </div>

                        <div class="card">
                            <h3>Управление</h3>
                            <div class="button-group button-group--stack">
                                <button class="btn warning" type="button" @click="$store.deviceMaintenance.performReboot()" :disabled="$store.deviceOta.started">Перезагрузка</button>
                                <button class="btn warning" type="button" @click="$store.deviceMaintenance.performModemReboot()" :disabled="$store.deviceOta.started">Перезагрузить модем</button>
                                <button class="btn danger" type="button" @click="$store.deviceMaintenance.resetBaseConfig()" :disabled="$store.deviceOta.started">Сброс конфигурации</button>
                                <button class="btn danger" type="button" @click="$store.deviceMaintenance.resetAllPrograms()" :disabled="$store.programs.loading || $store.deviceOta.started">
                                    <span x-show="!$store.programs.loading">Сброс программ</span>
                                    <span x-show="$store.programs.loading">
                                        Сброс... <span x-html="$store.uiFormat.spinnerSvg"></span>
                                    </span>
                                </button>
                            </div>
                        </div>

                        <div class="card">
                            <h3>Обновление прошивки (OTA)</h3>
                            <div class="notice notice-warning">
                                <strong>Внимание!</strong> Не отключайте питание во время обновления.
                            </div>
                            <div class="form-group">
                                <label class="form-label">Файл прошивки (.bin)</label>
                                <input type="file" class="form-control" id="firmwareFile" accept=".bin" @change="$store.deviceMaintenance.otaFileSelected" :disabled="$store.deviceOta.started">
                            </div>
                            <div class="ota-progress" x-show="$store.deviceOta.started">
                                <div class="progress-text" x-text="$store.deviceOta.progress + '%'"></div>
                                <div class="progress-bar"><div class="progress-fill" :style="{ width: $store.deviceOta.progress + '%' }"></div></div>
                                <div class="progress-status" x-text="$store.deviceOta.status"></div>
                            </div>
                            <div class="button-group">
                                <button class="btn warning" type="button" @click="$store.deviceMaintenance.startOTA()" :disabled="$store.deviceOta.started">
                                    <span x-show="!$store.deviceOta.started">Начать обновление</span>
                                    <span x-show="$store.deviceOta.started">
                                        Загрузка... <span x-html="$store.uiFormat.spinnerSvg"></span>
                                    </span>
                                </button>
                            </div>
                        </div>

                        <div class="card">
                            <h3>Логи системы</h3>
                            <pre
                                id="logsDisplay"
                                x-ref="logsContainer"
                                x-text="$store.uiLogs.text"
                                x-intersect="$store.uiLogs.setVisible(true)"
                                x-intersect:leave="$store.uiLogs.setVisible(false)"
                            ></pre>
                        </div>
                    </div>
                </template>
                <template x-if="!$store.deviceStatus.loaded">
                    <div class="card">Загрузка системной информации...</div>
                </template>
            </div>
        </main>
    </div>
</body>
</html>
