[env]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200 
upload_speed = 921600
board_build.filesystem = littlefs
; LittleFS: для корректного UI заливайте через `python build.py fs` (собирает монолитный index.html из маркеров в data/index.html + build.py).
board_build.flash_mode = dout
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld

; JsonStreamingParser: vendored under lib/JsonStreamingParser (const char* listener API, no per-token String).
; Network stack (8266): ESPAsyncWebServer + lwIP2 low-mem/low-flash (PIO_FRAMEWORK_ARDUINO_LWIP2_* in build_flags). Replacing the stack is a separate migration (RAM/timing regression risk).
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.9.5
    milesburton/DallasTemperature

build_flags = 
    -Os                     
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH    ; SIM800: ATE1 — эхо AT в RX (удобнее смотреть UART/диагностику; трафик чуть больше).
    -D GSM_MODEM_ECHO=1
    ; AsyncEventSource per-client queue (ESPAsyncWebServer). 4 overflowed on first SSE tick; 16 leaves margin vs incremental burst + UI log lines.
    -D SSE_MAX_QUEUED_MESSAGES=16
    -D AUTOSTART_ARDUINO=1

monitor_filters = 
    esp8266_exception_decoder

[env:esp12e_release]
build_type = release

[env:esp12e_debug]
build_type = debug
debug_build_flags =
    -Og
    -g3

; Compatibility alias for external scripts expecting `-e esp12e`.
[env:esp12e]
extends = env:esp12e_release

; RTOS big-bang target (separate runtime skeleton, no Arduino sources).
[env:esp12e_rtos]
platform = espressif8266
board = esp12e
framework = esp8266-rtos-sdk
monitor_speed = 115200
upload_speed = 921600
build_type = release
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D AUTOSTART_RTOS=1
build_src_filter =
    -<*>
    +<rtos/>