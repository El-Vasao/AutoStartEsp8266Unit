[env]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions_esp32c3.csv
board_build.flash_mode = qio
board_build.f_cpu = 160000000L

; ESP-C3-12F drop-in on ESP-12 PCB. SoftAP UI + SIM800 on UART0 (GPIO20/21).
; JsonStreamingParser: vendored under lib/JsonStreamingParser.
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.9.5
    milesburton/DallasTemperature

build_flags =
    -std=gnu++17
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D GSM_MODEM_ECHO=1
    -D SSE_MAX_QUEUED_MESSAGES=16
    -D AUTOSTART_ARDUINO=1
    -D AUTOSTART_ESP32C3=1

build_unflags =
    -std=gnu++11
    -std=c++11

monitor_filters =
    esp32_exception_decoder

[env:esp32c3_release]
build_type = release

[env:esp32c3_debug]
build_type = debug
debug_build_flags =
    -Og
    -g3

; Compatibility aliases
[env:esp32c3]
extends = env:esp32c3_release

[env:esp12e]
extends = env:esp32c3_release

[env:esp12e_release]
extends = env:esp32c3_release

[env:esp12e_debug]
extends = env:esp32c3_debug
